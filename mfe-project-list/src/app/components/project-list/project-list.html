<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="mb-4 text-dark fw-bold">CRUD em PHP</h2>

      <!-- Filtro e Botão de Adicionar -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-success px-4">+ Adicionar</button>
        <form class="d-flex gap-2" style="max-width: 350px;">
          <input type="text" class="form-control" placeholder="Filtrar...">
          <button class="btn btn-primary px-3">Filtrar</button>
        </form>
      </div>

      <!-- Tabela -->
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Id</th>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Email</th>
              <th>Sexo</th>
              <th>Nasc.</th>
              <th>Limite</th>
              <th>Hora</th>
            </tr>
          </thead>
          <tbody>
            <!-- Mantém a tua lógica de repetição do Angular (*ngFor) aqui nas <tr> -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
